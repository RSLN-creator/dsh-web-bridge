# dsh-webcode-bridge bundle layer.
# Applied when this package appears in a profile's dsh.profile.bundles list.
- insert:
    - id: webcode-bridge
      name: dsh-webcode-bridge
      config:
        # Local relay port (loopback only). The browser extension connects to ws://127.0.0.1:<port>/bridge
        port: 8931
        host: 127.0.0.1
        # Provider directory entry in the DSH model selector.
        providerId: webcode
        displayName: Web AI (webcode)
        modelId: deepseek-web
        modelName: DeepSeek Web (网页版)
        settingsNs: webcode
        # Consent gate: the extension must send consent.accepted=true (popup opt-in)
        # before any request is dispatched to the logged-in web page.
        requireConsent: true
        requestTimeoutMs: 240000
        queueTimeoutMs: 300000
