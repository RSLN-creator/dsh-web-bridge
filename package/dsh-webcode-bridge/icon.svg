<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Web Bridge</title>
  <!--
    品牌图标重绘（0.22.2，2026-10-24 用户授权「品牌图标也重绘，旧版保留可回退」）。

      形状    自绘悬索桥：24 网格，全部直线 + 一条二次贝塞尔（主缆），无自由弧参数
              ——每个坐标可离线核对。与 lib/client.cjs 的 DwbMark/DwbMarkColor
              共用同一组路径数据（scale 34 放大），两处漂移在结构上不可能。
              几何：桥面 M3.5 17.5H20.5；两塔 M7 6.5V17.5 / M17 6.5V17.5；
              锚缆 M3.5 17.5 7 6.5 / M17 6.5 20.5 17.5；
              主缆 M7 6.5Q12 12.1 17 6.5（垂度解析值 9.3）；
              吊索 M9.5 8.6V17.5 / M14.5 8.6V17.5（y = 6.5+11.2t−11.2t²，t=0.25）。
      底色    #ffffff · rx 77 · 描边 #D1D1D1（0.5px，与 0.19.58 定稿一致）
      本体    #000000；主缆+吊索 #65b3fc（品牌蓝青，自 0.19.57 沿用的品牌色）
      副影    #65b3fc，offset (−2,+3)（0.19.58 用户稿 iconShadow 原参数），opacity .55
      占画    内容 578×374，居中：translate(104 104) scale(34)
      旧版    0.19.58 定稿（Iconoir bridge-3d 旋转 90°，作者 Luca Burgio，MIT）
              在 git 历史可回退；本次自绘几何无第三方许可义务。
  -->
  <!-- 底：白底圆角方块 + 1px 描边 -->
  <rect x="0.5" y="0.5" width="1023" height="1023" rx="77" fill="#ffffff" stroke="#D1D1D1" />

  <!-- 副影（#65b3fc，offset −2,+3，1024 画布空间） -->
  <g transform="translate(-2 3)" opacity="0.55">
    <g transform="translate(104 104) scale(34)" stroke="#65b3fc" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 17.5H20.5" stroke-width="1.6" />
      <path d="M7 6.5V17.5" stroke-width="1.6" />
      <path d="M17 6.5V17.5" stroke-width="1.6" />
      <path d="M3.5 17.5 7 6.5" stroke-width="1.4" />
      <path d="M17 6.5 20.5 17.5" stroke-width="1.4" />
      <path d="M7 6.5Q12 12.1 17 6.5" stroke-width="1.4" />
      <path d="M9.5 8.6V17.5" stroke-width="1.3" />
      <path d="M14.5 8.6V17.5" stroke-width="1.3" />
    </g>
  </g>

  <!-- 本体：黑色结构 + 品牌蓝青主缆/吊索 -->
  <g transform="translate(104 104) scale(34)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 17.5H20.5" stroke="#000000" stroke-width="1.6" />
    <path d="M7 6.5V17.5" stroke="#000000" stroke-width="1.6" />
    <path d="M17 6.5V17.5" stroke="#000000" stroke-width="1.6" />
    <path d="M3.5 17.5 7 6.5" stroke="#000000" stroke-width="1.4" />
    <path d="M17 6.5 20.5 17.5" stroke="#000000" stroke-width="1.4" />
    <path d="M7 6.5Q12 12.1 17 6.5" stroke="#65b3fc" stroke-width="1.4" />
    <path d="M9.5 8.6V17.5" stroke="#65b3fc" stroke-width="1.3" />
    <path d="M14.5 8.6V17.5" stroke="#65b3fc" stroke-width="1.3" />
  </g>
</svg>
